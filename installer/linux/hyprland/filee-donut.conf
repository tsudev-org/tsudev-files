# DEPRECATED (TsuFiles 2.4.1): kept so that a hyprland.conf which sources this file from TsuFiles 2.4.0 keeps
# working. The rules match the new window title; change your line to hyprland/tsufiles-donut.conf.
# Window rules for the TsuFiles Donut on Hyprland (0.53 to 0.56)
#
# To use this file, add the following line to ~/.config/hypr/hyprland.conf:
#   source = ~/.local/share/filee/application/hyprland/tsufiles-donut.conf
# Remove this line before running uninstall.sh to avoid a missing-file warning.
#
# Hyprland 0.57 and newer read ~/.config/hypr/hyprland.lua instead; see INSTALL.txt
# for the Lua rule (hl.window_rule).

windowrule = float 1, match:title ^(TsuFiles Donut)$
windowrule = move (cursor_x-(window_w*0.5)) (cursor_y-(window_h*0.5)), match:title ^(TsuFiles Donut)$
windowrule = border_size 0, match:title ^(TsuFiles Donut)$
windowrule = no_shadow 1, match:title ^(TsuFiles Donut)$
windowrule = no_blur 1, match:title ^(TsuFiles Donut)$
