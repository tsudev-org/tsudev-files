# tsudev-files: cổng kiểm bảo mật - phân tích tĩnh (CodeQL), quét lộ bí mật (gitleaks), soát lỗ hổng phụ thuộc NuGet
# và kiểm tra bản dịch tiếng Việt. Mọi action ghim theo SHA commit; quyền token ở mức tối thiểu.
name: Bảo mật

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 2 * * 1'   # 09:17 thứ Hai giờ Việt Nam
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL (C#)
    # Repo riêng tư cần GitHub Advanced Security để tải kết quả CodeQL; tự bật khi repo chuyển sang công khai.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: csharp
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          category: /language:csharp

  secrets:
    name: Quét lộ bí mật (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # Ghim phiên bản + checksum. Không dùng gitleaks-action: action đòi GITLEAKS_LICENSE khi repo
      # thuộc Organization; binary trực tiếp không cần license, secret hay mã JavaScript bên thứ ba.
      # Nâng phiên bản: đổi CẢ HAI dòng, lấy checksum từ gitleaks_<ver>_checksums.txt của bản phát
      # hành chính thức (tải 2 lần độc lập, so khớp).
      GITLEAKS_VERSION: '8.30.1'
      GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tải gitleaks (ghim phiên bản, kiểm checksum)
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version
      # Quét toàn lịch sử. Dương tính giả đã đọc kỹ được miễn theo dấu vân tay trong .gitleaksignore.
      # --ignore-gitleaks-allow: chú thích `gitleaks:allow` trong diff không tự miễn được cho mình.
      - name: Quét toàn lịch sử git
        run: |
          "$RUNNER_TEMP/gitleaks" git \
            --redact \
            --ignore-gitleaks-allow \
            --no-banner \
            --verbose \
            --exit-code 1 \
            .

  dependencies:
    name: Lỗ hổng phụ thuộc NuGet
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json
      - name: Soát gói có lỗ hổng đã công bố (kể cả phụ thuộc bắc cầu)
        shell: bash
        run: |
          dotnet restore Filee.slnx
          dotnet list Filee.slnx package --vulnerable --include-transitive 2>&1 | tee vuln.txt
          if grep -qiE '\b(High|Critical)\b' vuln.txt; then
            echo "::error::Có gói NuGet mang lỗ hổng mức High/Critical"; exit 1
          fi

  i18n:
    name: Bản dịch tiếng Việt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python3 -I tools/check_i18n_vi.py
