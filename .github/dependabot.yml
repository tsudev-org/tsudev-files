# tsudev-files: tự động đề xuất PR nâng cấp phụ thuộc (bản vá bảo mật).
# Mỗi tháng một lần, gom MỌI gói của một hệ sinh thái vào một PR: mỗi PR chạy CI đầy đủ (Windows + macOS)
# và repo Private chỉ có 2.000 phút Actions/tháng, spending limit giữ 0 USD (quyết định 09/11/2026).
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule: { interval: monthly, timezone: Asia/Ho_Chi_Minh }
    open-pull-requests-limit: 2
    groups:
      nuget:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly, timezone: Asia/Ho_Chi_Minh }
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns: ["*"]
