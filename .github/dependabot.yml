# tsudev-files: tự động đề xuất PR nâng cấp phụ thuộc (bản vá bảo mật).
# Mỗi tháng một lần, gom MỌI gói của một hệ sinh thái vào một PR: mỗi PR chạy CI đầy đủ (Windows + macOS)
# để tiết kiệm phút Actions; spending limit giữ 0 USD (quyết định 09/11/2026; repo nay Public).
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule: { interval: monthly, timezone: Asia/Ho_Chi_Minh }
    open-pull-requests-limit: 2
    groups:
      nuget:
        patterns: ["*"]
    # Bản major (vd. SkiaSharp 3->4, xunit.v3 3->4) phá tương thích với mã upstream: chờ KnifeLemon/Filee nâng rồi
    # gộp về bằng `git merge upstream/main`. Lỗ hổng ở bản cũ vẫn bị job "Lỗ hổng phụ thuộc NuGet" (security.yml) báo.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Các gói phải giữ nguyên theo ghi chú trong Directory.Packages.props (PR #31 làm đỏ mọi job vì chúng):
      # PDFsharp 6.3+ là AGPL-3.0 và kiểm license lúc chạy; PDFtoImage 5.3+ / Svg.Skia 5.2+ cần SkiaSharp 4, xung đột
      # Avalonia 12.1; Unhwp ghim cùng commit nguồn trong build/build-native.py (chỉ nâng khi gộp upstream).
      - dependency-name: "PDFsharp"
        versions: [">= 6.3"]
      - dependency-name: "PDFtoImage"
        versions: [">= 5.3"]
      - dependency-name: "Svg.Skia"
        versions: [">= 5.2"]
      - dependency-name: "SkiaSharp*"
        versions: [">= 4"]
      - dependency-name: "Unhwp"
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly, timezone: Asia/Ho_Chi_Minh }
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns: ["*"]
  # tsudev-files: phụ thuộc của trang files.tsudev.com (website/).
  - package-ecosystem: npm
    directory: /website
    schedule: { interval: monthly, timezone: Asia/Ho_Chi_Minh }
    open-pull-requests-limit: 2
    groups:
      website:
        patterns: ["*"]
